<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arena Bola de Ouro - Login</title>
  <link rel="stylesheet" href="login.css">
  <link rel="stylesheet" href="stylesheader.css">
</head>
<body>

  <header class="header">
    <div class="logo">
      <div class="logo-circle"></div>
      <h2>ARENA BOLA DE OURO</h2>
    </div>

    <nav class="menu">
      <a href="home.html">Início</a>
      <a href="campos.html">Campos</a>
      <a href="agendar.html">Agendar</a>
      <a href="#">Contato</a>
    </nav>

    <div class="header-buttons">
      <a href="login.html" class="btn-link">Entrar</a>
      <a href="cadastro.html" class="btn-green">Cadastrar</a>
    </div>
  </header>

  <main class="main">
    <div class="card">
      <h3>ENTRAR</h3>
      <p class="subtitle">Faça login para acessar sua conta</p>

      <form>
        <div class="input-group">
          <label for="email">E-mail</label>
          <input type="email" id="email" placeholder="seu@email.com" required>
        </div>

        <div class="input-group">
          <label for="senha">Senha</label>
          <input type="password" id="senha" placeholder="Digite sua senha" required>
        </div>

        <button type="submit" class="btn-submit">
          Entrar
        </button>

        <p class="bottom-text">
          Não tem conta? <a href="cadastro.html">Cadastre-se</a>
        </p>
      </form>
    </div>
  </main>

</body>
</html>
